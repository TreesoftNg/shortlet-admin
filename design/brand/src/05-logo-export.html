<!doctype html>
<html><head><meta charset="utf-8"><title>Sunmade · Logo export</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=block" rel="stylesheet">
<script src="brand.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { padding: 4px; display: inline-block; }
</style></head>
<body>
<!-- One lockup on a transparent page, for render.sh. Options come from ?o=<JSON> (see lockupTile in brand.js). -->
<div id="logo"></div>
<script>
  const options = JSON.parse(new URLSearchParams(location.search).get('o') || '{}');
  document.getElementById('logo').dataset.final = JSON.stringify(options);
  renderFinal();
</script>
</body></html>
